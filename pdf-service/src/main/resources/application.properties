# Matches the 10MB cap multer enforces on the Node side, so the two layers
# reject the same set of files rather than one accepting what the other refuses.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:8080}

# Resumes are small; a large pool would just hold idle threads.
server.tomcat.threads.max=25
