# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Declares the Java PDF layout service. Apply it from the Render dashboard
# (Blueprints -> New Blueprint Instance) and the service is created with the
# settings below already correct, rather than clicked in by hand.
#
# The Node backend and the Vercel frontend are deliberately NOT declared here.
# Both already exist and are wired to their own deploy pipelines; adding them
# would let an apply overwrite live configuration.
services:
  - type: web
    name: careerlens-pdf-service
    runtime: docker
    plan: free
    region: oregon
    branch: main

    # Without this Render looks for a Dockerfile at the repository root, finds
    # none, and the build fails. It also scopes auto-deploys, so pushes that
    # only touch backend/ or frontend/ do not rebuild the JVM image.
    rootDir: pdf-service
    dockerfilePath: ./Dockerfile

    # ServiceTokenFilter leaves /health open precisely so this probe works.
    # Pointed at / it would get a 404 and Render would cycle the service
    # forever as unhealthy.
    healthCheckPath: /health

    envVars:
      # Generated by Render and never printed. Copy the same value into the
      # backend service's PDF_SERVICE_TOKEN — the two must match or every
      # request is rejected with 401 and the backend silently falls back.
      - key: PDF_SERVICE_TOKEN
        generateValue: true
