name: Deploy

# Deploys only after CI has passed on the same commit. Previously this ran
# directly on `push`, in parallel with CI — so a commit with failing tests
# still shipped to production.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # NOTE: there is deliberately no Vercel job here.
  #
  # Vercel deploys this repo through its own Git integration, which already
  # builds and promotes every push to main and reports back as the "Vercel"
  # commit status. The workflow used to run amondnet/vercel-action as well —
  # a second, redundant deploy path that had never once succeeded, because
  # VERCEL_TOKEN was never set. It failed with "Input required and not
  # supplied: vercel-token" on every run since the workflow was added, marking
  # otherwise-healthy deploys red.
  #
  # If you ever want CI to own the frontend deploy instead of the Git
  # integration, disconnect the Vercel project from GitHub first, or the two
  # will race to promote different builds.

  backend:
    name: Deploy Backend → Render
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check deploy hook is configured
        id: check
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set — skipping backend deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Without the guard above, an unset secret expanded to an empty string and
      # the step ran `curl -X POST ""`, failing with "URL rejected: Malformed
      # input to a URL function". Skipping is honest; failing on a missing
      # optional secret is just noise.
      - name: Trigger Render deploy
        if: steps.check.outputs.configured == 'true'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
